[package]
name = "wtcs-team-back"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.12.1"
serde_json = "1.0.145"
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-rustls", "chrono"] }
jsonwebtoken = "9"
serde = { version = "1.0.228", features = ["derive"] }
bcrypt = "0.15"
argon2 = "0.5"
dotenv = "0.15.0"
chrono = { version = "0.4", features = ["serde"] }
actix-cors = "0.7"
log = "0.4.29"
regex = "1.12.3"
http = "0.2.12"
